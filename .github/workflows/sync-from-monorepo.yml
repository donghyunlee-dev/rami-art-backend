name: Sync backend from monorepo

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-backend-from-monorepo
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out backend repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Fetch frontend master
        env:
          MONOREPO_URL: https://github.com/donghyunlee-dev/v0-rami-art-studio-web.git
        run: git clone --depth 1 --branch master "$MONOREPO_URL" "$RUNNER_TEMP/monorepo"

      - name: Check for the monorepo backend
        id: source
        run: |
          if [ -f "$RUNNER_TEMP/monorepo/backend/gradlew" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Monorepo backend found." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No backend/ directory is published on frontend master yet; nothing was changed." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Mirror backend directory
        if: steps.source.outputs.available == 'true'
        run: |
          rsync -a --delete \
            --exclude='/.git/' \
            --exclude='/supabase/' \
            "$RUNNER_TEMP/monorepo/backend/" ./

      - name: Commit and push changes
        if: steps.source.outputs.available == 'true'
        run: |
          git add --all
          if git diff --cached --quiet; then
            echo "Backend repository already matches frontend master." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(sync): mirror monorepo backend"
          git push origin HEAD:master
          echo "Backend files synchronized from frontend master." >> "$GITHUB_STEP_SUMMARY"
